# Phase 7: run the tests and the retrieval evaluation on every push and pull request.
#
# 1. tests            unit tests + check that every eval-set quote exists in the chunks (~2 min)
# 2. retrieval-eval   rebuild the search index from the committed chunk snapshot in a fresh
#                     Postgres + pgvector, run the 79-question retrieval eval, and FAIL the build
#                     if recall@5 drops below the minimums (~35 min on CPU: ~17 min to embed
#                     15,436 chunks, ~17 min for the reranker over 79 questions)
#
# The answer-generation eval (Llama 3.1 8B, scripts/evaluate_answers.py) needs a 5 GB model and
# ~20 min of GPU time, so it runs locally, not here.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]  # documentation-only changes don't need a 35-min eval
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests + eval-set check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Every eval-set quote exists in the chunks
        run: python scripts/check_eval_set.py --chunk-sets section_300

  retrieval-eval:
    name: Retrieval evaluation (quality gate)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grantscope
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grantscope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Cache AI models (bge-small embeddings + bge-reranker-base)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('app/embeddings.py', 'app/search.py') }}
      - name: Create database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Load grant metadata
        run: python scripts/load_metadata.py
      - name: Embed chunks from the committed snapshot
        run: python scripts/embed_chunks.py --chunk-set section_300
      - name: Evaluate retrieval (fails if recall@5 drops below the minimums)
        # Minimums sit ~2 questions below the measured scores (see docs/results.md), so CPU-vs-GPU
        # rounding differences don't fail the build but a real regression does.
        run: >
          python scripts/evaluate_retrieval.py --chunk-sets section_300
          --methods vector hybrid_rerank --label ci
          --min-recall5 vector=0.79 hybrid_rerank=0.87
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-results
          path: eval/results/*_ci.json
